services:
  kafka:
    container_name: kafka-test
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      # Stateless: No volumes mapped, data lost on container stop.

  kafka-ui:
    container_name: kafka-ui-test
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8081:8080" # Port 8081 for test environment
    environment:
      - KAFKA_CLUSTERS_0_NAME=integration-test-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  producer:
    container_name: producer-test
    build: .
    command: python -m producer.producer
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./tests/integration/producer_config_test.yml:/app/src/producer/producer_config.yml
    restart: on-failure
    depends_on:
      - kafka

  consumer:
    container_name: consumer-test
    build: .
    command: python -m consumer.consumer
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./tests/integration/consumer_config_test.yml:/app/src/consumer/consumer_config.yml
    restart: on-failure
    depends_on:
      - kafka
